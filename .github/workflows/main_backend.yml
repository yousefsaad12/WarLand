jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend  # <--- Tells GitHub to run inside backend/

      - name: Build application
        run: npm run build
        working-directory: ./backend  # <--- Compiles NestJS to backend/dist/main.js

      - name: Zip artifact for deployment
        run: zip -r release.zip .
        working-directory: ./backend/dist # <--- Packages the compiled output
