
name: Build and deploy Node.js app to Azure Web App - WarLand

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Get repository source code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm

      # Prisma config reads DATABASE_URL during generation.
      # This placeholder is only for CI installation and generation.
      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/warland

      # 3. Generate Prisma Client
      - name: Generate Prisma Client
        run: npm run prisma:generate -w backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/warland

      # 4. Compile NestJS backend
      - name: Build backend
        run: npm run build -w backend

      # 5. Run backend tests
      - name: Run backend tests
        run: npm test -w backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/warland

      # 6. Upload deployment files
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            package.json
            package-lock.json
            backend/
            frontend/package.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      # 1. Download successful build artifact
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      # 2. Authenticate with Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7BBA2914A8E4461AB2879745D7CB04BF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_34009E523872431BBEF0087FC792D212 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7CF8A28FFBAD488A81EEB90879AA1212 }}

      # 3. Deploy to Azure App Service
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: WarLand
          slot-name: Production
          package: .
